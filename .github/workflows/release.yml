name: release

# Conventional-commit driven release: every push to main computes the next
# semver from the commits since the last v* tag (feat -> minor, BREAKING
# CHANGE / `!:` -> major, anything else -> patch), bumps package.json,
# publishes to npm, and tags the release.
#
# Publishing uses npm trusted publishing (OIDC) — no long-lived NPM_TOKEN
# secret. The package's trusted publisher on npmjs.com must name this exact
# workflow file (release.yml) with `npm publish` allowed, and requires
# id-token: write plus npm >= 11.5.1 (Node 24 ships it) below.
#
# Loop guard: the release commit itself (`chore(release): …`) touches the
# package and re-triggers this workflow; it is excluded from the bump scan,
# so the follow-up run finds nothing to release and exits.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: write # push the version-bump commit and the release tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Node 24 ships npm >= 11.5.1, the minimum for OIDC trusted publishing.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds

      - name: Compute next version from conventional commits
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")

          if git describe --tags --match "v*" --abbrev=0 >/dev/null 2>&1; then
            RANGE="$(git describe --tags --match "v*" --abbrev=0)..HEAD"
          else
            RANGE="HEAD"
          fi

          # Release commits are excluded so the bump commit never re-releases.
          COMMITS=$(git log --format=%s%n%b "$RANGE" | grep -v '^chore(release)' || true)
          if [ -z "$COMMITS" ]; then
            echo "No package commits since ${LAST_TAG:-the beginning} — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LEVEL=patch
          if echo "$COMMITS" | grep -qE '(^|[[:space:]])[a-zA-Z]+(\([^)]*\))?!:|BREAKING CHANGE:'; then
            LEVEL=major
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]*\))?!?:'; then
            LEVEL=minor
          fi

          NEXT=$(node -e "
            const [maj, min, pat] = '$CURRENT'.split('.').map(Number);
            const map = { major: [maj + 1, 0, 0], minor: [maj, min + 1, 0], patch: [maj, min, pat + 1] };
            console.log(map['$LEVEL'].join('.'));
          ")

          echo "Bumping $CURRENT -> $NEXT ($LEVEL) based on:"
          echo "$COMMITS" | grep -E '^[a-zA-Z]+(\([^)]*\))?!?:' | head -20
          {
            echo "release=true"
            echo "version=$NEXT"
            echo "level=$LEVEL"
          } >> "$GITHUB_OUTPUT"

      - name: Skip — nothing to release
        if: steps.bump.outputs.release != 'true'
        run: echo "No unreleased package changes — done"

      - name: Bump version
        if: steps.bump.outputs.release == 'true'
        run: npm version "${{ steps.bump.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Commit and push the version bump
        if: steps.bump.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): opencode-slack-bridge v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main

      - name: Install dependencies
        if: steps.bump.outputs.release == 'true'
        run: npm ci

      - name: Build
        if: steps.bump.outputs.release == 'true'
        run: npm run build

      - name: Test
        if: steps.bump.outputs.release == 'true'
        run: npm test

      - name: Publish to npm
        if: steps.bump.outputs.release == 'true'
        # No NODE_AUTH_TOKEN: npm >= 11.5.1 detects the GitHub Actions OIDC
        # environment and exchanges the short-lived id-token automatically.
        run: npm publish --access public

      - name: Create and push tag
        if: steps.bump.outputs.release == 'true'
        run: |
          echo "releasing opencode-slack-bridge@${{ steps.bump.outputs.version }}"
          git tag -a "v${{ steps.bump.outputs.version }}" -m "opencode-slack-bridge v${{ steps.bump.outputs.version }}"
          git push origin "refs/tags/v${{ steps.bump.outputs.version }}"
